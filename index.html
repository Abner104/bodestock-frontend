<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logoo.png" />
    <link rel="apple-touch-icon" href="/logoo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Bodestock - Sistema de gestión de inventario y costos para tu empresa. Controla tu stock, calcula costos y gestiona tu equipo." />
    <meta name="theme-color" content="#3B82F6" />
    <title>Bodestock - Gestión de Inventario y Costos</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
