<!-- Logo Bodestock - Versión Completa -->
<svg width="180" height="48" viewBox="0 0 180 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icono: Cajas apiladas con gráfico -->
  <g id="icon">
    <!-- Caja trasera -->
    <rect x="3" y="14" width="14" height="14" rx="2" fill="#3B82F6" opacity="0.3"/>

    <!-- Caja frontal -->
    <rect x="7" y="18" width="14" height="14" rx="2" fill="#3B82F6"/>

    <!-- Línea de tendencia hacia arriba -->
    <path d="M9 26 L12 23 L15 24 L19 20" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Punto final -->
    <circle cx="19" cy="20" r="2" fill="white"/>
  </g>

  <!-- Texto STOCKLY -->
  <g id="text">
    <text x="35" y="32" font-family="Arial, sans-serif" font-weight="700" font-size="24" fill="#1E293B" letter-spacing="-0.5">
      Bodestock
    </text>
  </g>
</svg>
